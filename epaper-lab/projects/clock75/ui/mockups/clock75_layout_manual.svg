<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #000; stroke-width: 1; }
      .label { font-family: Avenir; font-size: 16px; fill: #000; }
      .label-xs { font-family: Avenir; font-size: 20px; font-weight: bold; fill: #000; }
      .label-sm { font-family: Avenir; font-size: 24px; font-weight: bold; fill: #000; }
      .label-med { font-family: Avenir; font-size: 32px; font-weight: bold; fill: #000; }
      .label-lg { font-family: Avenir; font-size: 48px; font-weight: bold; fill: #000; }
      .label-xl { font-family: Avenir; font-size: 64px; font-weight: bold; fill: #000; }
      .label-xxl { font-family: Avenir; font-size: 80px; font-weight: bold; fill: #000; }
      .label-xxxl { font-family: Avenir; font-size: 112px; font-weight: bold; fill: #000; }
      .label-dev { font-family: "Kohinoor Devanagari"; font-size: 40px; fill: #000; }
      .divider { stroke: #000; stroke-width: 1; }
      .label-inv { font-family: Avenir; font-size: 20px; font-weight: bold; fill: #fff; }
      .divider-inv { stroke: #fff; stroke-width: 3; }
      .xaxis-inv { stroke: #fff; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="480"/>

  <!-- Left main panel -->
  <rect x="10" y="10" width="780" height="234" fill="#ffffff"/>
  <line class="divider" x1="10" y1="10" x2="790" y2="10" stroke-width="2"/>
  <line class="divider" x1="10" y1="244" x2="790" y2="244" stroke-width="2"/>
  <line class="divider" x1="10" y1="10" x2="10" y2="244" stroke-width="2"/>
  <line class="divider" x1="790" y1="10" x2="790" y2="244" stroke-width="2"/>

  <!-- Bottom chart area (780x230) -->
  <rect x="10" y="240" width="780" height="230" fill="#ffffff"/>
  <line class="divider" x1="10" y1="240" x2="790" y2="240" stroke-width="2"/>
  <line class="divider" x1="10" y1="470" x2="790" y2="470" stroke-width="2"/>
  <line class="divider" x1="10" y1="240" x2="10" y2="470" stroke-width="2"/>
  <line class="divider" x1="790" y1="240" x2="790" y2="470" stroke-width="2"/>
  <!-- Night shading (sunset->sunrise, rightmost) -->
  <rect x="530" y="240" width="260" height="230" fill="#000"/>
  <!-- Chart split line (moon horizon at 0°) -->
  <line class="divider" x1="10" y1="396" x2="530" y2="396"/>
  <line class="xaxis-inv" x1="530" y1="396" x2="790" y2="396"/>


  <!-- Date + time moved to top-left -->
  <text class="label-xl" x="24" y="72">WED 10/11</text>
  <text class="label-dev" x="24" y="128">कार्तिक शुक्ल एकादशी</text>
  <text class="label-xxxl" x="24" y="220">12:38</text>
  <text class="label-sm" x="340" y="200">PM</text>
  <text class="label-sm" x="340" y="230">EST</text>

  <!-- vertical top divider -->
  <line class="divider" x1="410" y1="16" x2="410" y2="230"/>

  <!-- Vertical forecast divider -->
  <line class="divider" x1="640" y1="16" x2="640" y2="230"/>

  <!-- Outdoor temp block -->
  <text class="label-sm" x="420" y="48">Outdoor</text>
  <text class="label-xxl" x="430" y="120">48</text>
  <text class="label-sm" x="530" y="80">°F</text>

  <!-- Indoor temp block -->
  <text class="label-xxl" x="510" y="190">72</text>
  <text class="label-sm" x="610" y="150">°F</text>
  <text class="label-sm" x="520" y="228">Indoor</text>



  <!-- Bottom charts: labels -->
  <text class="label-sm" x="46" y="460">Temp °F</text>
  <text class="label-inv" x="744" y="460" text-anchor="end">Moon Elev °</text>

  <!-- Temperature y-axis ticks (left) -->
  <text class="label-xs" x="16" y="300">80</text>
  <text class="label-xs" x="16" y="332">70</text>
  <text class="label-xs" x="16" y="364">60</text>
  <text class="label-xs" x="16" y="396">50</text>
  <text class="label-xs" x="16" y="428">40</text>
  <text class="label-xs" x="16" y="460">30</text>

  <!-- Moon elevation y-axis ticks (right) -->
  <text class="label-inv" x="780" y="270" text-anchor="end">90</text>
  <text class="label-inv" x="780" y="310" text-anchor="end">60</text>
  <text class="label-inv" x="780" y="350" text-anchor="end">30</text>
  <text class="label-inv" x="780" y="396" text-anchor="end">0</text>
  <text class="label-inv" x="780" y="458" text-anchor="end">-30</text>

  <!-- Time ticks between charts (day) -->
  <line class="divider" x1="60" y1="391" x2="60" y2="401"/>
  <line class="divider" x1="130" y1="391" x2="130" y2="401"/>
  <line class="divider" x1="200" y1="391" x2="200" y2="401"/>
  <line class="divider" x1="270" y1="391" x2="270" y2="401"/>
  <line class="divider" x1="340" y1="391" x2="340" y2="401"/>
  <line class="divider" x1="410" y1="391" x2="410" y2="401"/>
  <line class="divider" x1="480" y1="391" x2="480" y2="401"/>
  <!-- Time ticks in night section (inverted) -->
  <line class="divider-inv" x1="550" y1="391" x2="550" y2="401"/>
  <line class="divider-inv" x1="620" y1="391" x2="620" y2="401"/>
  <line class="divider-inv" x1="690" y1="391" x2="690" y2="401"/>
  <line class="divider-inv" x1="760" y1="391" x2="760" y2="401"/>

  <text class="label-xs" x="50" y="418">7a</text>
  <text class="label-xs" x="120" y="418">9a</text>
  <text class="label-xs" x="190" y="418">11a</text>
  <text class="label-xs" x="260" y="418">1p</text>
  <text class="label-xs" x="330" y="418">3p</text>
  <text class="label-xs" x="400" y="418">5p</text>
  <text class="label-xs" x="470" y="418">7p</text>
  <text class="label-inv" x="540" y="418">9p</text>
  <text class="label-inv" x="610" y="418">11p</text>
  <text class="label-inv" x="680" y="418">1a</text>
  <text class="label-inv" x="750" y="418">3a</text>

  <!-- Temperature curve (actual vs forecast) -->
  <line x1="40" y1="420" x2="120" y2="400" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="400" x2="200" y2="370" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="370" x2="280" y2="340" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="340" x2="360" y2="320" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="360" y1="320" x2="440" y2="310" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="440" y1="310" x2="520" y2="320" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="520" y1="320" x2="600" y2="345" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="600" y1="345" x2="680" y2="370" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="680" y1="370" x2="760" y2="400" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="40" y1="430" x2="120" y2="410" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="410" x2="200" y2="380" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="380" x2="280" y2="350" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="350" x2="360" y2="330" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="360" y1="330" x2="440" y2="320" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="440" y1="320" x2="520" y2="330" stroke="#000" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="520" y1="330" x2="600" y2="355" stroke="#fff" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="600" y1="355" x2="680" y2="380" stroke="#fff" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="680" y1="380" x2="760" y2="410" stroke="#fff" stroke-width="2" stroke-dasharray="8,6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Moon elevation curve and icon -->
  <line x1="40" y1="430" x2="120" y2="390" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="390" x2="200" y2="320" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="320" x2="280" y2="270" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="280" y1="270" x2="360" y2="260" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="360" y1="260" x2="440" y2="270" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="440" y1="270" x2="520" y2="310" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="520" y1="310" x2="600" y2="380" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="600" y1="380" x2="680" y2="430" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="680" y1="430" x2="760" y2="460" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="360" cy="270" r="10" fill="#000"/>
  <circle cx="365" cy="270" r="9" fill="#fff"/>

  <!-- 7‑Day rows (text only, 6 rows) -->
  <text class="label-sm" x="706" y="36" text-anchor="end">Thu</text>
  <text class="label-sm" x="714" y="36" text-anchor="start">29/38</text>
  <text class="label-sm" x="706" y="74" text-anchor="end">Fri</text>
  <text class="label-sm" x="714" y="74" text-anchor="start">18/32</text>
  <text class="label-sm" x="706" y="112" text-anchor="end">Sat</text>
  <text class="label-sm" x="714" y="112" text-anchor="start">26/39</text>
  <text class="label-sm" x="706" y="150" text-anchor="end">Sun</text>
  <text class="label-sm" x="714" y="150" text-anchor="start">27/41</text>
  <text class="label-sm" x="706" y="188" text-anchor="end">Mon</text>
  <text class="label-sm" x="714" y="188" text-anchor="start">23/32</text>
  <text class="label-sm" x="706" y="226" text-anchor="end">Tue</text>
  <text class="label-sm" x="714" y="226" text-anchor="start">19/35</text>

  <!--
  <text class="label" x="730" y="282" text-anchor="middle">Later Today</text>
  -->
</svg>
