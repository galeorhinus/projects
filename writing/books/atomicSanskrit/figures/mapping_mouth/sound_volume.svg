<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <rect width="1180" height="760" fill="#f7f7f5"/>

  <style>
    .serif { font-family: "Gentium Book Plus", Georgia, serif; }
    .dev { font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", serif; }
    .title { font-size: 42px; fill: #242426; font-weight: 700; }
    .subtitle { font-size: 21px; fill: #68686d; font-style: italic; }
    .axis { font-size: 18px; fill: #4d4d52; }
    .small { font-size: 15px; fill: #66666a; }
    .tiny { font-size: 13px; fill: #77777b; }
    .cell { fill: #d8d8d4; stroke: #4a4a4a; stroke-width: 1.1; }
    .ghost { fill: #ffffff; fill-opacity: 0.26; stroke: #9a9a9a; stroke-width: 0.8; }
    .empty { fill: none; stroke: #adadad; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .fiber { fill: #d8a24a; stroke: #4c3920; stroke-width: 1.3; }
    .fiber2 { fill: #e8bd72; stroke: #4c3920; stroke-width: 1.3; }
    .line { stroke: #b7b7b3; stroke-width: 1; }
  </style>

  <text x="590" y="58" text-anchor="middle" class="serif title">The Sound Volume</text>
  <text x="590" y="91" text-anchor="middle" class="serif subtitle">the consonant plane extended through the fourteen-vowel axis</text>

  <g transform="translate(120 165)">
    <text x="320" y="-42" text-anchor="middle" class="serif axis">5 x 7 consonant plane</text>
    <text x="-52" y="135" text-anchor="middle" transform="rotate(-90 -52 135)" class="serif small">manner classes</text>
    <text x="320" y="307" text-anchor="middle" class="serif small">mouth stations</text>

    <g opacity="0.55" transform="translate(98 -52)">
      <rect x="0" y="0" width="458" height="276" fill="#eeeeeb" stroke="#c8c8c3"/>
      <line x1="0" y1="46" x2="458" y2="46" class="line"/>
      <line x1="0" y1="92" x2="458" y2="92" class="line"/>
      <line x1="0" y1="138" x2="458" y2="138" class="line"/>
      <line x1="0" y1="184" x2="458" y2="184" class="line"/>
      <line x1="0" y1="230" x2="458" y2="230" class="line"/>
      <line x1="91.6" y1="0" x2="91.6" y2="276" class="line"/>
      <line x1="183.2" y1="0" x2="183.2" y2="276" class="line"/>
      <line x1="274.8" y1="0" x2="274.8" y2="276" class="line"/>
      <line x1="366.4" y1="0" x2="366.4" y2="276" class="line"/>
    </g>

    <g opacity="0.78" transform="translate(62 -26)">
      <rect x="0" y="0" width="458" height="276" fill="#eeeeeb" stroke="#bdbdb8"/>
      <line x1="0" y1="46" x2="458" y2="46" class="line"/>
      <line x1="0" y1="92" x2="458" y2="92" class="line"/>
      <line x1="0" y1="138" x2="458" y2="138" class="line"/>
      <line x1="0" y1="184" x2="458" y2="184" class="line"/>
      <line x1="0" y1="230" x2="458" y2="230" class="line"/>
      <line x1="91.6" y1="0" x2="91.6" y2="276" class="line"/>
      <line x1="183.2" y1="0" x2="183.2" y2="276" class="line"/>
      <line x1="274.8" y1="0" x2="274.8" y2="276" class="line"/>
      <line x1="366.4" y1="0" x2="366.4" y2="276" class="line"/>
    </g>

    <g>
      <rect x="26" y="0" width="458" height="276" fill="#eeeeeb" stroke="#2e2e30"/>
      <g class="line">
        <line x1="26" y1="46" x2="484" y2="46"/>
        <line x1="26" y1="92" x2="484" y2="92"/>
        <line x1="26" y1="138" x2="484" y2="138"/>
        <line x1="26" y1="184" x2="484" y2="184"/>
        <line x1="26" y1="230" x2="484" y2="230"/>
        <line x1="117.6" y1="0" x2="117.6" y2="276"/>
        <line x1="209.2" y1="0" x2="209.2" y2="276"/>
        <line x1="300.8" y1="0" x2="300.8" y2="276"/>
        <line x1="392.4" y1="0" x2="392.4" y2="276"/>
      </g>
    </g>

    <g class="dev" font-size="25" text-anchor="middle" dominant-baseline="middle">
      <text x="71.8" y="23">क</text><text x="163.4" y="23">च</text><text x="255" y="23">ट</text><text x="346.6" y="23">त</text><text x="438.2" y="23">प</text>
      <text x="71.8" y="69">ख</text><text x="163.4" y="69">छ</text><text x="255" y="69">ठ</text><text x="346.6" y="69">थ</text><text x="438.2" y="69">फ</text>
      <text x="71.8" y="115">ग</text><text x="163.4" y="115">ज</text><text x="255" y="115">ड</text><text x="346.6" y="115">द</text><text x="438.2" y="115">ब</text>
      <text x="71.8" y="161">घ</text><text x="163.4" y="161">झ</text><text x="255" y="161">ढ</text><text x="346.6" y="161">ध</text><text x="438.2" y="161">भ</text>
      <text x="71.8" y="207">ङ</text><text x="163.4" y="207">ञ</text><text x="255" y="207">ण</text><text x="346.6" y="207">न</text><text x="438.2" y="207">म</text>
      <text x="163.4" y="253">य</text><text x="255" y="253">र</text><text x="346.6" y="253">ल</text><text x="438.2" y="253">व</text>
    </g>

    <rect x="26" y="322" width="458" height="54" class="empty"/>
    <text x="255" y="352" text-anchor="middle" class="serif small">two empty consonant cells extend through all fourteen vowels</text>
  </g>

  <g transform="translate(700 154)">
    <text x="184" y="-31" text-anchor="middle" class="serif axis">one lit क fiber</text>
    <text x="184" y="-6" text-anchor="middle" class="serif small">a teaching row unrolled through the vowel axis</text>

    <g class="dev" font-size="23" text-anchor="middle" dominant-baseline="middle">
      <rect x="0" y="22" width="70" height="42" rx="3" class="fiber"/><text x="35" y="45">क</text>
      <rect x="78" y="22" width="88" height="42" rx="3" class="fiber2"/><text x="122" y="45">का</text>
      <rect x="174" y="22" width="70" height="42" rx="3" class="fiber"/><text x="209" y="45">कि</text>
      <rect x="252" y="22" width="88" height="42" rx="3" class="fiber2"/><text x="296" y="45">की</text>

      <rect x="0" y="82" width="70" height="42" rx="3" class="fiber"/><text x="35" y="105">कु</text>
      <rect x="78" y="82" width="88" height="42" rx="3" class="fiber2"/><text x="122" y="105">कू</text>
      <rect x="174" y="82" width="70" height="42" rx="3" class="fiber"/><text x="209" y="105">कृ</text>
      <rect x="252" y="82" width="88" height="42" rx="3" class="fiber2"/><text x="296" y="105">कॄ</text>

      <rect x="0" y="142" width="70" height="42" rx="3" class="fiber"/><text x="35" y="165">कॢ</text>
      <rect x="78" y="142" width="88" height="42" rx="3" class="fiber2"/><text x="122" y="165">कॣ</text>
      <rect x="174" y="142" width="88" height="42" rx="3" class="fiber2"/><text x="218" y="165">के</text>
      <rect x="270" y="142" width="88" height="42" rx="3" class="fiber2"/><text x="314" y="165">कै</text>

      <rect x="64" y="202" width="88" height="42" rx="3" class="fiber2"/><text x="108" y="225">को</text>
      <rect x="160" y="202" width="88" height="42" rx="3" class="fiber2"/><text x="204" y="225">कौ</text>
    </g>

    <line x1="35" y1="270" x2="310" y2="270" stroke="#4c3920" stroke-width="1.4"/>
    <text x="35" y="300" text-anchor="middle" class="serif tiny">V1</text>
    <text x="122" y="300" text-anchor="middle" class="serif tiny">V2</text>
    <text x="209" y="300" text-anchor="middle" class="serif tiny">V1</text>
    <text x="296" y="300" text-anchor="middle" class="serif tiny">V2</text>
    <text x="184" y="334" text-anchor="middle" class="serif small">width marks measured duration: short vowels narrower, long vowels wider</text>

    <rect x="-20" y="386" width="410" height="154" fill="#ffffff" fill-opacity="0.72" stroke="#c9c9c5"/>
    <text x="18" y="424" class="serif axis">Counting the volume</text>
    <text x="18" y="462" class="serif small">5 mouth stations x 7 consonant rows x 14 vowels = 490 possible addresses</text>
    <text x="18" y="496" class="serif small">2 empty consonant cells x 14 vowels = 28 empty addresses</text>
    <text x="18" y="530" class="serif small">490 - 28 = 462 occupied consonant-vowel addresses</text>
  </g>

  <text x="590" y="720" text-anchor="middle" class="serif small">The plane selects sonomers; the vowel axis turns one cell into a timed path through speech.</text>
</svg>
