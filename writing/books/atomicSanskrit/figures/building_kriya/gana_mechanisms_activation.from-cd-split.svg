="start">श</text><text x="158.58" y="103" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start" font-style="italic">śa</text><text x="170.10000000000002" y="103" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#c3b9a3" text-anchor="start">/</text><text x="175.10000000000002" y="103" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="start">अ</text><text x="183.68000000000004" y="103" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start" font-style="italic">a</text><text x="312" y="103" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="end">⟪तुद्⟫ → तुदति</text><text x="40" y="113" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#766652" text-anchor="start">thematic activation with class behavior</text><text x="312" y="113" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="end" font-style="italic">tud → tudati</text><line x1="40" y1="117" x2="312" y2="117" stroke="#e2dac9" stroke-width="0.7" /><rect x="12" y="126" width="300" height="15" fill="#f2ede2" stroke="#c3b9a3" stroke-width="0.7" /><text x="20" y="136" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="9" font-weight="700" fill="#2b2b2d" text-anchor="start">Direct activation</text><text x="304" y="136" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#2b2b2d" text-anchor="end">nothing is added; the ending meets the atom</text><circle cx="27" cy="154.4" r="6.72" fill="none" stroke="#9a7833" stroke-width="0.9" /><text x="27" y="1