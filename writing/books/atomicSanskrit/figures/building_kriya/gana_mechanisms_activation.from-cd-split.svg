t-size="9" font-weight="700" fill="#2b2b2d" text-anchor="start">Reduplication</text><text x="304" y="190" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#2b2b2d" text-anchor="end">the atom echoes itself before activating</text><circle cx="27" cy="208.4" r="6.72" fill="none" stroke="#9a7833" stroke-width="0.9" /><text x="27" y="211" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="700" fill="#9a7833" text-anchor="middle">3</text><text x="40" y="211" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="start">जुहोत्यादि</text><text x="98.8" y="211" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start" font-style="italic">juhotyādi</text><text x="150" y="211" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="start">अभ्यास</text><text x="186.48" y="211" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start" font-style="italic">abhyāsa</text><text x="312" y="211" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="end">⟪धा⟫ → दधाति</text><text x="40" y="221" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#766652" text-anchor="start">echo/duplication before activation</text><text x="312" y="221" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="end" font-style="italic">dhā → dadhāti</text><line x1="40" y1="225" x2="312" y2="225" stroke="#e2dac9" stroke-width="0.7" /><rect x="12" y="234" width="300" height="15" fill="#aa9a7a" /><text x="20" y="244" font-family="