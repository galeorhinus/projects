<svg xmlns="http://www.w3.org/2000/svg" id="fig-c" viewBox="0 0 324 294" width="4.5in" height="4.083in"><rect x="0" y="0" width="324" height="294" fill="#f4f4f3" /><text x="12" y="20" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="11" font-weight="700" fill="#2b2b2d" text-anchor="start">Four Mechanisms, Five Classes</text><text x="12" y="31" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start">Five gaṇas activate the atom without a suffixal extension.</text><line x1="12" y1="36" x2="312" y2="36" stroke="#2b2b2d" stroke-width="1.2" /><rect x="12" y="45" width="300" height="15" fill="#ece4d3" /><text x="20" y="55" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="9" font-weight="700" fill="#2b2b2d" text-anchor="start">Thematic activation</text><text x="304" y="55" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#2b2b2d" text-anchor="end">a vowel is appended and the stem becomes thematic</text><circle cx="27" cy="73.4" r="6.72" fill="none" stroke="#9a7833" stroke-width="0.9" /><text x="27" y="76" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="700" fill="#9a7833" text-anchor="middle">1</text><text x="40" y="76" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="start">भ्वादि</text><text x="76.47999999999999" y="76" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-weight="400" fill="#4a4136" text-anchor="start" font-style="italic">bhvādi</text><text x="150" y="76" font-family="'Noto Serif Devanagari','Adobe Devanagari',serif" font-size="9" font-weight="400" fill="#2b2b2d" text-anchor="start">शप्</text><text x="169.74" y="76" font-family="'Gentium Book Plus',Charter,'Charis SIL',Georgia,serif" font-size="8" font-w