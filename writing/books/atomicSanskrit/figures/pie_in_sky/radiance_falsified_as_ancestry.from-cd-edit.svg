<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="4.5in" height="3.616in">
  <rect x="0" y="0" width="1120" height="900" fill="#f4f4f3"/>
  <g>
    <text x="560.0" y="64.1" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="42" font-weight="700" fill="#2b2b2d" text-anchor="middle">Radiance Falsified as Ancestry</text>
    <text x="560.0" y="99" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="middle">The transmission is real.</text>
    <text x="560.0" y="133" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="middle">The parent projected behind the reflections is imaginary.</text>
    <line x1="26.0" y1="151" x2="1094.0" y2="151" stroke="#2b2b2d" stroke-width="1.4" stroke-dasharray=""/>
    <rect x="26.0" y="176" width="1068.0" height="230" rx="5" fill="#f4efe4" stroke="#766652" stroke-width="1.6" stroke-dasharray=""/>
    <text x="42.0" y="221" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="34" font-weight="700" fill="#2b2b2d" text-anchor="start">THE TRANSMISSION — recorded, forward</text>
    <g transform="translate(68.0,246) scale(1.1250)">
      <path d="M66.0,48.0 L57.0,32.4 L39.0,32.4 L30.0,48.0 L39.0,63.6 L57.0,63.6 Z" fill="#cf8a2e"/>
      <path d="M74.1,48.0 L88.0,48.0 M70.5,35.0 L78.0,30.7 M61.0,25.5 L68.0,13.4 M48.0,21.9 L48.0,13.4 M35.0,25.5 L28.0,13.4 M25.5,35.0 L18.0,30.7 M21.9,48.0 L8.0,48.0 M25.5,61.0 L18.0,65.3 M35.0,70.5 L28.0,82.6 M48.0,74.1 L48.0,82.6 M61.0,70.5 L68.0,82.6 M70.5,61.0 L78.0,65.3" fill="none" stroke="#cf8a2e" stroke-width="5.7" stroke-linecap="round"/>
    </g>
    <text x="122.0" y="383" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="700" fill="#2b2b2d" text-anchor="middle">SANSKRIT</text>
    <circle cx="356" cy="300" r="34" fill="#766652" stroke="#766652" stroke-width="1.4"/>
    <text x="356.0" y="370" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">carriers</text>
    <circle cx="586" cy="300" r="34" fill="#766652" stroke="#766652" stroke-width="1.4"/>
    <text x="586.0" y="370" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">contact</text>
    <circle cx="826" cy="300" r="34" fill="#d5c6a5" stroke="#766652" stroke-width="1.4"/>
    <text x="826.0" y="383" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">reflections</text>
    <path d="M 180 300 L 314 300" fill="none" stroke="#766652" stroke-width="2.6" stroke-dasharray="" stroke-linecap="round" marker-end="url(#ar)"/>
    <path d="M 392 300 L 544 300" fill="none" stroke="#766652" stroke-width="2.6" stroke-dasharray="" stroke-linecap="round" marker-end="url(#ar)"/>
    <path d="M 622 300 L 784 300" fill="none" stroke="#766652" stroke-width="2.6" stroke-dasharray="" stroke-linecap="round" marker-end="url(#ar)"/>
    <text x="1068" y="257" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="end">Greek</text>
    <text x="1068" y="291" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="end">Latin</text>
    <text x="1068" y="325" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="end">Avestan</text>
    <text x="1068" y="359" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#4a4136" text-anchor="end">Germanic</text>
    <line x1="26.0" y1="431" x2="1094.0" y2="431" stroke="#c3b9a3" stroke-width="1.2" stroke-dasharray="8 7"/>
    <rect x="26.0" y="456" width="1068.0" height="302" rx="5" fill="#efe1df" stroke="#7b2d26" stroke-width="1.8" stroke-dasharray="11 8"/>
    <text x="42.0" y="501" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="34" font-weight="700" fill="#64231f" text-anchor="start">THE RECONSTRUCTION — unrecorded, backward</text>
    <g transform="translate(72 560)" color="#7b2d26">
      <path d="M 52.79 11.31 L 89.21 80.69 Q 92 86 86 86 L 14 86 Q 8 86 10.79 80.69 L 47.21 11.31 Q 50 6 52.79 11.31 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-dasharray="7 6"/>
      <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
        <line x1="50" y1="73" x2="50" y2="43"/>
        <line x1="37.01" y1="65.5" x2="62.99" y2="50.5"/>
        <line x1="37.01" y1="50.5" x2="62.99" y2="65.5"/>
      </g>
    </g>
    <text x="122.0" y="696" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">imaginary PIE</text>
    <circle cx="304" cy="608" r="26" fill="none" stroke="#7b2d26" stroke-width="1.6" stroke-dasharray="5 5"/>
    <circle cx="538" cy="608" r="26" fill="none" stroke="#7b2d26" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M 510 608 L 332 608" fill="none" stroke="#7b2d26" stroke-width="2.4" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#arR)"/>
    <path d="M 276 608 L 180 608" fill="none" stroke="#7b2d26" stroke-width="2.4" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#arR)"/>
    <text x="570" y="550" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#2b2b2d" text-anchor="start">The reflections are read backward</text>
    <text x="570" y="592" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#2b2b2d" text-anchor="start">into a parent no record contains;</text>
    <text x="570" y="634" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#2b2b2d" text-anchor="start">the recorded source is then filed</text>
    <text x="570" y="676" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#2b2b2d" text-anchor="start">beneath its own reflection.</text>
    <text x="560.0" y="821" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">The upper path follows recorded transmission. The lower path reverses that</text>
    <text x="560.0" y="863" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="32" font-weight="400" fill="#766652" text-anchor="middle">movement and manufactures an imaginary parent.</text>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#766652"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7b2d26"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9a7833"/>
    </marker>
  </defs>
</svg>
