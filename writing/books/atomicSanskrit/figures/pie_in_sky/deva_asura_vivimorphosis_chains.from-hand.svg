<svg xmlns="http://www.w3.org/2000/svg" width="4.75in" height="3.96in" viewBox="0 0 1200 1000">
  <defs>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9a7d3c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#9a5147"/>
    </marker>
  </defs>
  <rect width="1200" height="1000" fill="#f7f6f2"/>
  <style>
    .title { font-family: "EB Garamond", serif; font-size: 48px; font-weight: 700; fill: #292724; }
    .subtitle { font-family: "EB Garamond", serif; font-size: 32px; font-style: italic; fill: #6a6258; }
    .colhead { font-family: "EB Garamond", serif; font-size: 38px; font-weight: 700; fill: #292724; }
    .stage { font-family: "EB Garamond", serif; font-size: 32px; font-weight: 700; fill: #7b6a4b; }
    .main { font-family: "EB Garamond", serif; font-size: 38px; font-weight: 700; fill: #292724; }
    .body { font-family: "EB Garamond", serif; font-size: 32px; fill: #403b35; }
    .projection { font-family: "EB Garamond", serif; font-size: 36px; font-weight: 700; fill: #8a352a; }
    .projection-note { font-family: "EB Garamond", serif; font-size: 32px; font-style: italic; fill: #8a352a; }
    .callout { font-family: "EB Garamond", serif; font-size: 32px; fill: #403b35; }
    .dev { font-family: "Noto Serif Devanagari", serif; font-size: 40px; }
    .dev-stage { font-family: "Noto Serif Devanagari", serif; font-size: 34px; }
  </style>

  <text x="600" y="58" text-anchor="middle" class="title">Recorded Chains and Projected Ancestors</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">The solid chains move forward. The dashed ancestors are projected backward.</text>

  <text x="311" y="160" text-anchor="middle" class="colhead"><tspan class="dev">देवः</tspan>  devaḥ</text>
  <text x="889" y="160" text-anchor="middle" class="colhead"><tspan class="dev">असुरः</tspan>  asura</text>

  <g transform="translate(42 182)">
    <rect width="538" height="136" rx="8" fill="#f4e7e3" stroke="#9a5147" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="269" y="38" text-anchor="middle" class="stage" fill="#8a352a">PYRAMID'S PROJECTED</text>
    <text x="269" y="70" text-anchor="middle" class="stage" fill="#8a352a">ANCESTOR</text>
    <text x="269" y="112" text-anchor="middle" class="projection">*deiwós  ←  *dyew-</text>
  </g>
  <g transform="translate(620 182)">
    <rect width="538" height="136" rx="8" fill="#f4e7e3" stroke="#9a5147" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="269" y="38" text-anchor="middle" class="stage" fill="#8a352a">PYRAMID'S PROJECTED</text>
    <text x="269" y="70" text-anchor="middle" class="stage" fill="#8a352a">ANCESTOR</text>
    <text x="269" y="112" text-anchor="middle" class="projection">*h₂n̥su-  <tspan class="projection-note">contested</tspan></text>
  </g>

  <g transform="translate(57 231) scale(0.52)" color="#8a352a" aria-label="PIE projection">
    <path d="M 52.79 11.31 L 89.21 80.69 Q 92 86 86 86 L 14 86 Q 8 86 10.79 80.69 L 47.21 11.31 Q 50 6 52.79 11.31 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-dasharray="7 6"/>
    <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="73" x2="50" y2="43"/>
      <line x1="37.01" y1="65.5" x2="62.99" y2="50.5"/>
      <line x1="37.01" y1="50.5" x2="62.99" y2="65.5"/>
    </g>
  </g>
  <g transform="translate(635 231) scale(0.52)" color="#8a352a" aria-label="PIE projection">
    <path d="M 52.79 11.31 L 89.21 80.69 Q 92 86 86 86 L 14 86 Q 8 86 10.79 80.69 L 47.21 11.31 Q 50 6 52.79 11.31 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-dasharray="7 6"/>
    <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="73" x2="50" y2="43"/>
      <line x1="37.01" y1="65.5" x2="62.99" y2="50.5"/>
      <line x1="37.01" y1="50.5" x2="62.99" y2="65.5"/>
    </g>
  </g>

  <line x1="311" y1="358" x2="311" y2="318" stroke="#9a5147" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <line x1="889" y1="358" x2="889" y2="318" stroke="#9a5147" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>

  <g transform="translate(42 358)">
    <rect width="538" height="160" rx="8" fill="#e8e1cf" stroke="#9a7d3c" stroke-width="2.5"/>
    <text x="269" y="42" text-anchor="middle" class="stage"><tspan class="dev-stage">शब्दः</tspan> (śabdaḥ)</text>
    <text x="269" y="76" text-anchor="middle" class="stage">SANSKRIT WORD</text>
    <text x="269" y="118" text-anchor="middle" class="main"><tspan class="dev">देवः</tspan>  devaḥ</text>
    <text x="269" y="149" text-anchor="middle" class="body">the shining one</text>
  </g>
  <g transform="translate(620 358)">
    <rect width="538" height="160" rx="8" fill="#e8e1cf" stroke="#9a7d3c" stroke-width="2.5"/>
    <text x="269" y="42" text-anchor="middle" class="stage"><tspan class="dev-stage">शब्दः</tspan> (śabdaḥ)</text>
    <text x="269" y="76" text-anchor="middle" class="stage">SANSKRIT WORD</text>
    <text x="269" y="118" text-anchor="middle" class="main"><tspan class="dev">असुरः</tspan>  asura</text>
    <text x="269" y="149" text-anchor="middle" class="body">spoken form · no hyphen</text>
  </g>

  <line x1="311" y1="518" x2="311" y2="548" stroke="#9a7d3c" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <line x1="889" y1="518" x2="889" y2="548" stroke="#9a7d3c" stroke-width="3" marker-end="url(#arrow-gold)"/>

  <g transform="translate(42 555)">
    <rect width="538" height="125" rx="8" fill="#f0ece3" stroke="#77736d" stroke-width="2.5"/>
    <text x="269" y="43" text-anchor="middle" class="stage"><tspan class="dev-stage">बीजम्</tspan> (bījam) · LISTENER'S SEED</text>
    <text x="269" y="96" text-anchor="middle" class="body">received by an Italic listener</text>
  </g>
  <g transform="translate(620 555)">
    <rect width="538" height="125" rx="8" fill="#f0ece3" stroke="#77736d" stroke-width="2.5"/>
    <text x="269" y="43" text-anchor="middle" class="stage"><tspan class="dev-stage">बीजम्</tspan> (bījam) · LISTENER'S SEED</text>
    <text x="269" y="96" text-anchor="middle" class="body">received by an Iranian listener</text>
  </g>

  <line x1="311" y1="680" x2="311" y2="716" stroke="#9a7d3c" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <line x1="889" y1="680" x2="889" y2="716" stroke="#9a7d3c" stroke-width="3" marker-end="url(#arrow-gold)"/>

  <g transform="translate(42 724)">
    <rect width="538" height="135" rx="8" fill="#e5e2dd" stroke="#77736d" stroke-width="2.5"/>
    <text x="269" y="42" text-anchor="middle" class="stage"><tspan class="dev-stage">अपशब्दः</tspan> (apaśabdaḥ)</text>
    <text x="269" y="75" text-anchor="middle" class="stage">RECEIVING WORD</text>
    <text x="269" y="117" text-anchor="middle" class="main">Latin  deus</text>
  </g>
  <g transform="translate(620 724)">
    <rect width="538" height="135" rx="8" fill="#e5e2dd" stroke="#77736d" stroke-width="2.5"/>
    <text x="269" y="42" text-anchor="middle" class="stage"><tspan class="dev-stage">अपशब्दः</tspan> (apaśabdaḥ)</text>
    <text x="269" y="75" text-anchor="middle" class="stage">RECEIVING WORD</text>
    <text x="269" y="117" text-anchor="middle" class="main">Avestan  ahura</text>
  </g>

  <g transform="translate(42 895)">
    <rect width="1116" height="82" rx="8" fill="#eee0dc" stroke="#9a5147" stroke-width="2.5"/>
    <text x="558" y="33" text-anchor="middle" class="callout">Sanskrit has several internal analyses.</text>
    <text x="558" y="66" text-anchor="middle" class="callout">The spoken form enters the Iranian chain without a hyphen.</text>
  </g>
</svg>
