IL', Georgia, serif" font-size="27.68" font-weight="400" fill="#2b2b2d" text-anchor="start"> contains; the recorded source is then</text><text x="586.0" y="616.7" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="27.68" font-weight="400" fill="#2b2b2d" text-anchor="start"> filed beneath its own reflection.</text><text x="560.0" y="736.3" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="27.68" font-weight="400" fill="#766652" text-anchor="middle">The upper path follows recorded transmission. The lower path reverses that</text><text x="560.0" y="772.2" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="27.68" font-weight="400" fill="#766652" text-anchor="middle">movement and manufactures an imaginary parent.</text></g><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#766652"/></marker><marker id="arR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7b2d26"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9a7833"/></marker></defs></svg>
