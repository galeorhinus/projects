<svg viewBox="0 0 1120 890" width="4.5in" height="3.576in" xmlns="http://www.w3.org/2000/svg" data-om-id="228773f2:160"><rect x="0" y="0" width="1120" height="890" fill="#f4f4f3" data-om-id="228773f2:161"/><text x="560" y="84" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-weight="bold" font-size="42" fill="#2b2b2d" data-om-id="228773f2:162">*(s)ker- — the Phantom of Cutting</text><text x="560" y="120" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-size="26" fill="#8a857b" data-om-id="228773f2:163">Their tree again: an s in parentheses, a t appended at need. No Sanskrit on the page</text><path d="M470,644 C429.5,530 200,592 200,456" fill="none" stroke="#aa9a7a" stroke-width="34" stroke-linecap="round" data-om-id="228773f2:164"/><path d="M560,644 C560.0,530 560,592 560,456" fill="none" stroke="#ece4d3" stroke-width="26" stroke-linecap="round" stroke-dasharray="2 20" data-om-id="228773f2:165"/><path d="M560,644 C560.0,530 560,592 560,456" fill="none" stroke="#766652" stroke-width="2" stroke-dasharray="6 8" data-om-id="228773f2:166"/><path d="M650,644 C688.3,530 905,592 905,456" fill="none" stroke="#ece4d3" stroke-width="26" stroke-linecap="round" stroke-dasharray="2 20" data-om-id="228773f2:167"/><path d="M650,644 C688.3,530 905,592 905,456" fill="none" stroke="#766652" stroke-width="2" stroke-dasharray="6 8" data-om-id="228773f2:168"/><path d="M200,336 C200,230 130,280 130,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:169"/><path d="M200,336 C200,230 285,280 285,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:170"/><path d="M560,336 C560,230 455,280 455,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:171"/><path d="M560,336 C560,230 560,280 560,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:172"/><path d="M560,336 C560,230 665,280 665,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:173"/><path d="M905,336 C905,230 800,280 800,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:174"/><path d="M905,336 C905,230 905,280 905,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:175"/><path d="M905,336 C905,230 1010,280 1010,206" fill="none" stroke="#cbbb98" stroke-width="12" stroke-linecap="round" data-om-id="228773f2:176"/><text x="130" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:177">curt</text><text x="285" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:178">cortex</text><text x="455" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:179">short</text><text x="560" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:180">shirt</text><text x="665" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:181">skirt</text><text x="800" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:182">shear</text><text x="905" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:183">share</text><text x="1010" y="180" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="31" fill="#2b2b2d" data-om-id="228773f2:184">score</text><rect x="45" y="330" width="310" height="132" rx="8" fill="#8a795a" stroke="#766652" stroke-width="2.2" data-om-id="228773f2:185"/><text x="200" y="386" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-weight="bold" font-size="34.6" fill="#f3f2ef" data-om-id="228773f2:186">curtus</text><text x="200" y="422" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="26" fill="#e8e2d2" data-om-id="228773f2:187">Latin — “short” · no s</text><rect x="395" y="330" width="330" height="132" rx="8" fill="#ece4d3" stroke="#766652" stroke-width="2.2" stroke-dasharray="7 7" data-om-id="228773f2:188"/><text x="560" y="386" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-weight="bold" font-size="34.6" fill="#2b2b2d" data-om-id="228773f2:189">*skurtaz</text><text x="560" y="422" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="26" fill="#4a3f30" data-om-id="228773f2:190">Proto-Germanic — s + t</text><rect x="740" y="330" width="340" height="132" rx="8" fill="#ece4d3" stroke="#766652" stroke-width="2.2" stroke-dasharray="7 7" data-om-id="228773f2:191"/><text x="905" y="386" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-weight="bold" font-size="34.6" fill="#2b2b2d" data-om-id="228773f2:192">*skeraną</text><text x="905" y="422" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="26" fill="#4a3f30" data-om-id="228773f2:193">Proto-Germanic — s, no t</text><rect x="390" y="640" width="340" height="116" rx="8" fill="#ece4d3" stroke="#766652" stroke-width="2.2" stroke-dasharray="7 7" data-om-id="228773f2:194"/><text x="560" y="686" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-weight="bold" font-size="34.6" fill="#2b2b2d" data-om-id="228773f2:195">*(s)ker-</text><text x="560" y="720" text-anchor="middle" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="27.7" fill="#4a3f30" data-om-id="228773f2:196">“to cut”</text><text x="45" y="800" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-size="26" fill="#8a857b" data-om-id="228773f2:197">( ) = the “s-mobile”: a consonant with no source, no rule, no meaning</text><text x="45" y="833" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-size="26" fill="#8a857b" data-om-id="228773f2:198">t = a “root extension”: appended where needed; meaningless by their own account</text><text x="45" y="866" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-style="italic" font-size="26" fill="#8a857b" data-om-id="228773f2:199">dashed = reconstructed; never spoken, never attested — and no Sanskrit appears on it</text></svg>