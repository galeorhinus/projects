<text x="137.0" y="1058.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="31" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">इकारान्त / उकारान्त (ikārānta / ukārānta)</text>
<text x="137.0" y="1096.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="27" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Relation: पञ्चमी–षष्ठी एकवचनम् (pañcamī–ṣaṣṭhī ekavacanam)</text>
<text x="137.0" y="1129.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">वैदिक: can use the same -एः / -ओः (-eḥ / -oḥ) pattern as masculine and</text>
<text x="137.0" y="1164.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">feminine words; -यः / -वः (-yaḥ / -vaḥ) also occur</text>
<text x="137.0" y="1199.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">लौकिक: requires -इनः / -उनः (-inaḥ / -unaḥ)</text>
<text x="137.0" y="1234.0" font-family="STIX Two Text, Georgia, serif" font-size="26" font-weight="400" font-style="normal" fill="#9d7c36" text-anchor="start">Contribution: open · Evidence: form recorded · question open</text>
<text x="137.0" y="1266.0" font-family="STIX Two Text, Georgia, serif" font-size="25" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Prevalence: &gt;92.1% (70/76 lexemes) · grade B</text>
