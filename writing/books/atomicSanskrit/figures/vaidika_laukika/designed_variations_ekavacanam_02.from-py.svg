<text x="137.0" y="495.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="27" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Relation: चतुर्थी एकवचनम् (caturthī ekavacanam)</text>
<text x="137.0" y="528.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">वैदिक: Alongside -अये / -अवे (-aye / -ave), Vedic preserves the</text>
<text x="137.0" y="563.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">shorter -ये / -वे (-ye / -ve); feminine -ई (-ī) can represent</text>
<text x="137.0" y="598.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">contracted -इए (-ie)</text>
<text x="137.0" y="633.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">लौकिक: -अये / -अवे (-aye / -ave)</text>
<text x="137.0" y="668.0" font-family="STIX Two Text, Georgia, serif" font-size="26" font-weight="400" font-style="normal" fill="#9d7c36" text-anchor="start">Contribution: MAT · ARR · Evidence: passage checked · function shown</text>
<text x="137.0" y="700.0" font-family="STIX Two Text, Georgia, serif" font-size="25" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Prevalence: &lt;4.8% (3/63 lexemes) · grade B</text>
<line x1="34" y1="724" x2="1166" y2="724" stroke="#cfc6b5" stroke-width="1"/>
<text x="34.0" y="759.0" font-family="STIX Two Text, Georgia, serif" font-size="29" font-weight="600" font-style="normal" fill="#9d7c36" text-anchor="start">SG-07</text>
<text x="137.0" y="759.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="31" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">इकारान्त / उकारान्त (ikārānta / ukārānta)</text>
<text x="137.0" y="797.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="27" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Relation: चतुर्थी एकवचनम् (caturthī ekavacanam)</text>
<text x="137.0" y="830.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">वैदिक: uses several patterns, including -अये, -वे, -अवे (-aye, -ve,</text>
<text x="137.0" y="865.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">-ave); forms with inserted न् (n) are sporadic</text>
<text x="137.0" y="900.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">लौकिक: requires -इने / -उने (-ine / -une)</text>
<text x="137.0" y="935.0" font-family="STIX Two Text, Georgia, serif" font-size="26" font-weight="400" font-style="italic" fill="#8b4b3d" text-anchor="start">Qualification: RECURRING</text>
<text x="137.0" y="967.0" font-family="STIX Two Text, Georgia, serif" font-size="26" font-weight="400" font-style="normal" fill="#9d7c36" text-anchor="start">Contribution: open · Evidence: form recorded · question open</text>
<text x="137.0" y="999.0" font-family="STIX Two Text, Georgia, serif" font-size="25" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Prevalence: 5.6% (1/18 tokens) · grade A</text>
