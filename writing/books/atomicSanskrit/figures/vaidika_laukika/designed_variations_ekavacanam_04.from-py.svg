<text x="137.0" y="264.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">वैदिक: This is a distributional absence rather than an alternate form:</text>
<text x="137.0" y="299.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">equivalents of laukika -इनि (-ini) are absent from the oldest checked</text>
