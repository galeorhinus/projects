<text x="137.0" y="701.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">लौकिक: permits expanded -यै, -याः, -याम् / -वै, -वाः, -वाम् (-yai,</text>
<text x="137.0" y="736.0" font-family="Tiro Devanagari Sanskrit, Noto Serif Devanagari, serif" font-size="29" font-weight="400" font-style="normal" fill="#29251f" text-anchor="start">-yāḥ, -yām / -vai, -vāḥ, -vām) forms</text>
