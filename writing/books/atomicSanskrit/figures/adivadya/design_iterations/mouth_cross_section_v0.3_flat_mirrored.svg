<?xml version="1.0" encoding="UTF-8"?>
<!--
  adivadya_mouth_cross_section_v0.3_flat_mirrored.svg

  Schematic sagittal cross-section of the human vocal apparatus, hand-coded
  as a structural template for the polished Illustrator base that will
  eventually replace it.

  v0.3 — 2026-06-05 — flat-mirrored from v0.1 (head faces left,
    matching Image 3; paths use natively mirrored coords, no
    wrapper transform)
    - Topology and proportions only; not anatomically refined
    - All 24 named visible layers + 5 hidden zone-of-articulation layers present
    - Greyscale palette matches book-assets.css tokens
    - viewBox 1120 × 1400, rendered at 4.5in × 5.625in (portrait)

  Orientation: head facing right (anterior). Top of head at top of canvas.

  Intended use:
    1. Drop into Illustrator
    2. Trace over each named layer with refined Bezier curves
    3. Re-export with the same layer names preserved
    4. Or use as-is if the schematic style suffices for the book

  Layer ID conventions match adivadya_mouth_cross_section_brief.md.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 1400"
     width="4.5in"
     height="5.625in">

  <title>Mouth Cross-Section — Schematic Base (v0.3 flat-mirrored)</title>

  <defs>
    <style><![CDATA[
      .anatomy-fill { fill: #d4d4d4; stroke: #2b2b2d; stroke-width: 1.5; stroke-linejoin: round; }
      .cavity-fill  { fill: #f4f4f3; stroke: #2b2b2d; stroke-width: 1.2; stroke-linejoin: round; }
      .accent-fill  { fill: #a8a8a8; stroke: #2b2b2d; stroke-width: 1.2; }
      .faint-line   { fill: none; stroke: #b8b8b8; stroke-width: 0.6; stroke-dasharray: 4,3; }
      .marker       { fill: none; stroke: #888888; stroke-width: 0.8; stroke-dasharray: 2,2; }
      .label        { font-family: 'Gentium Book Plus', Georgia, serif; font-size: 18px; fill: #888888; font-style: italic; }
    ]]></style>
  </defs>

  <!-- Background field -->
  <rect width="1120" height="1400" fill="#f4f4f3"/>

  <!-- ======================================================== -->
  <!-- 1. Face profile (outer head silhouette, sagittal view)   -->
  <!-- ======================================================== -->
  <g id="face-profile">
    <path d="M 470 140  C 300 135 175 195 135 360  L 120 390  C 45 405 10 460 45 500  C 62 525 72 545 72 560  L 72 568  C 58 575 42 590 45 612  C 50 628 65 638 78 642  L 85 648  C 78 658 62 670 58 690  C 58 706 72 716 90 720  C 110 723 135 722 155 722  C 185 727 215 748 240 790  C 252 820 262 858 262 905  L 262 1400  L 870 1400  L 870 970  C 885 880 910 770 925 660  C 940 540 942 415 900 295  C 850 200 735 155 620 145  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. Mandible (jaw outline — faint subdivision)            -->
  <!-- ======================================================== -->
  <g id="mandible">
    <path d="M 540 770  C 430 762 320 760 240 755  C 220 758 200 770 185 790  C 175 815 185 840 200 855" class="faint-line"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. Oral and pharyngeal cavity (the hollow interior)      -->
  <!--    This is the negative-space shape inside which the     -->
  <!--    organs sit. Filled with background color.             -->
  <!-- ======================================================== -->
  <g id="cavity-interior">
    <path d="M 100 588  L 120 593  C 170 590 250 590 310 590  C 360 595 405 612 435 625  C 440 645 430 660 420 670  C 450 700 500 740 530 790  C 550 820 565 860 565 900  C 565 920 555 935 540 945  C 535 990 537 1040 540 1090  L 540 1380  L 262 1380  L 262 730  C 250 720 230 712 215 712  C 180 712 140 712 110 712  C 95 707 90 695 90 685  C 95 670 105 660 102 650  C 92 642 85 632 90 618  C 95 605 98 595 100 588  Z" class="cavity-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. Nasal cavity                                          -->
  <!-- ======================================================== -->
  <g id="nasal-cavity">
    <path d="M 410 410  C 370 405 300 400 220 405  C 170 408 135 415 110 430  C 105 460 110 490 120 520  C 140 545 180 560 240 565  C 300 568 350 568 390 565  C 415 558 425 540 425 510  C 425 475 420 440 410 410  Z" class="cavity-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 5. Nasal passage opening (coupling point behind velum)   -->
  <!--    Where nasal cavity opens into oropharynx              -->
  <!-- ======================================================== -->
  <g id="nasal-passage-opening">
    <path d="M 425 565  C 428 580 428 595 430 610  C 432 620 435 625 440 625" class="marker"/>
  </g>

  <!-- ======================================================== -->
  <!-- 6. Hard palate (roof of oral cavity, front portion)      -->
  <!-- ======================================================== -->
  <g id="hard-palate">
    <path d="M 300 580  C 250 575 200 575 150 578  C 135 580 122 585 120 593  C 122 596 130 596 140 595  C 185 593 240 593 295 595  C 302 593 305 588 300 580  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 7. Soft palate / velum (back portion of palate)          -->
  <!-- ======================================================== -->
  <g id="soft-palate-velum">
    <path d="M 410 595  C 380 592 340 590 300 590  C 298 595 300 600 305 603  C 340 608 380 615 405 620  C 415 618 420 612 418 605  C 415 600 412 597 410 595  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 8. Uvula (hanging at end of soft palate)                 -->
  <!-- ======================================================== -->
  <g id="uvula">
    <path d="M 415 618  C 418 628 420 640 423 650  C 425 656 430 658 435 655  C 438 648 435 640 430 632  C 428 625 422 620 415 618  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 9. Alveolar ridge (bony bump behind upper teeth)         -->
  <!-- ======================================================== -->
  <g id="alveolar-ridge">
    <path d="M 130 590  C 122 590 115 592 112 598  C 114 603 120 605 128 603  C 133 599 133 594 130 590  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 10. Upper teeth (incisors visible in section)            -->
  <!-- ======================================================== -->
  <g id="teeth-upper">
    <path d="M 122 605  L 105 605  L 105 632  L 122 632  Z" fill="#f0efed" stroke="#2b2b2d" stroke-width="1"/>
  </g>

  <!-- ======================================================== -->
  <!-- 11. Lower teeth (incisors visible in section)            -->
  <!-- ======================================================== -->
  <g id="teeth-lower">
    <path d="M 130 668  L 112 668  L 112 690  L 130 690  Z" fill="#f0efed" stroke="#2b2b2d" stroke-width="1"/>
  </g>

  <!-- ======================================================== -->
  <!-- 12. Upper lip                                            -->
  <!-- ======================================================== -->
  <g id="lips-upper">
    <path d="M 100 595  C 80 590 62 590 50 600  C 42 615 45 632 62 645  C 78 648 92 642 100 632  C 105 620 105 605 100 595  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 13. Lower lip                                            -->
  <!-- ======================================================== -->
  <g id="lips-lower">
    <path d="M 100 655  C 82 655 65 662 60 678  C 58 695 68 708 85 712  C 100 712 110 700 110 685  C 110 672 105 660 100 655  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 14. Tongue outline (overall shape)                       -->
  <!-- ======================================================== -->
  <g id="tongue-outline">
    <path d="M 140 640  C 170 630 220 622 270 620  C 320 622 360 628 400 640  C 430 660 450 685 460 720  C 460 745 450 760 430 770  C 380 778 320 778 250 775  C 200 770 160 758 135 730  C 128 705 128 680 132 660  C 135 650 138 643 140 640  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 15. Tongue tip (apex / jihvāgra)                         -->
  <!--     Subdivision marker — faint hairline                  -->
  <!-- ======================================================== -->
  <g id="tongue-tip">
    <path d="M 195 630  C 195 650 192 680 190 710" class="faint-line"/>
  </g>

  <!-- ======================================================== -->
  <!-- 16. Tongue blade (lamina / jihvopāgra)                   -->
  <!-- ======================================================== -->
  <g id="tongue-blade">
    <path d="M 270 622  C 270 645 265 685 262 720" class="faint-line"/>
  </g>

  <!-- ======================================================== -->
  <!-- 17. Tongue body (dorsum / jihvāmadhya)                   -->
  <!-- ======================================================== -->
  <g id="tongue-body">
    <path d="M 350 628  C 350 650 345 695 340 735" class="faint-line"/>
  </g>

  <!-- ======================================================== -->
  <!-- 18. Tongue root (radix / jihvāmūla)                      -->
  <!--     Back portion of tongue, leading into pharynx         -->
  <!-- ======================================================== -->
  <g id="tongue-root">
    <path d="M 425 655  C 430 690 435 730 435 770" class="faint-line"/>
  </g>

  <!-- ======================================================== -->
  <!-- 19. Oropharynx (vertical column behind tongue)           -->
  <!-- ======================================================== -->
  <g id="oropharynx">
    <path d="M 520 700  C 525 740 530 780 535 820  L 515 820  C 510 780 505 740 500 700  Z" class="anatomy-fill" opacity="0.4"/>
  </g>

  <!-- ======================================================== -->
  <!-- 20. Epiglottis (small leaf at top of larynx)             -->
  <!-- ======================================================== -->
  <g id="epiglottis">
    <path d="M 505 810  C 500 800 490 795 480 800  C 475 815 478 830 485 838  C 495 838 502 828 505 818  C 506 815 506 812 505 810  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 21. Larynx outline (houses vocal cords)                  -->
  <!-- ======================================================== -->
  <g id="larynx-outline">
    <path d="M 545 845  C 535 842 505 842 485 845  L 482 940  C 495 945 520 945 540 942  L 545 845  Z" class="anatomy-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 22. Vocal cords (two horizontal folds inside larynx)     -->
  <!-- ======================================================== -->
  <g id="vocal-cords">
    <rect x="487" y="878" width="48" height="6" class="accent-fill"/>
    <rect x="487" y="895" width="48" height="6" class="accent-fill"/>
  </g>

  <!-- ======================================================== -->
  <!-- 23. Glottis gap (the space between vocal cords)          -->
  <!--     Marker only — the actual space is between the two    -->
  <!--     vocal cord rects above.                              -->
  <!-- ======================================================== -->
  <g id="glottis-gap">
    <rect x="487" y="884" width="48" height="11" fill="none" stroke="#888888" stroke-width="0.5" stroke-dasharray="2,1"/>
  </g>

  <!-- ======================================================== -->
  <!-- 24. Trachea (windpipe, descending from larynx)           -->
  <!-- ======================================================== -->
  <g id="trachea">
    <path d="M 540 945  L 482 945  L 478 1100  L 545 1100  Z" class="anatomy-fill"/>
    <!-- Cartilage rings (faint horizontal lines for realism) -->
    <line x1="538" y1="975"  x2="480" y2="975"  stroke="#b0b0b0" stroke-width="0.6"/>
    <line x1="538" y1="1005" x2="480" y2="1005" stroke="#b0b0b0" stroke-width="0.6"/>
    <line x1="538" y1="1035" x2="480" y2="1035" stroke="#b0b0b0" stroke-width="0.6"/>
    <line x1="538" y1="1065" x2="479" y2="1065" stroke="#b0b0b0" stroke-width="0.6"/>
  </g>

  <!-- ======================================================== -->
  <!-- 25. Lungs inset (small reference diagram, bottom-left)   -->
  <!--     Optional element representing the breath source      -->
  <!-- ======================================================== -->
  <g id="lungs-inset">
    <!-- Inset frame -->
    <rect x="740" y="1170" width="320" height="210" fill="#fbfbfa" stroke="#cccccc" stroke-width="0.8" stroke-dasharray="3,2"/>
    <!-- Inset label -->
    <text x="900" y="1196" text-anchor="middle" class="label">breath source</text>
    <!-- Left lung -->
    <path d="M 1010 1240  C 1020 1280 1015 1330 990 1355  C 965 1360 945 1340 940 1310  C 940 1280 945 1250 955 1230  C 975 1220 1000 1225 1010 1240  Z" fill="#d4d4d4" stroke="#2b2b2d" stroke-width="1.2"/>
    <!-- Right lung -->
    <path d="M 840 1240  C 830 1280 835 1330 860 1355  C 885 1360 905 1340 910 1310  C 910 1280 905 1250 895 1230  C 875 1220 850 1225 840 1240  Z" fill="#d4d4d4" stroke="#2b2b2d" stroke-width="1.2"/>
    <!-- Trachea stub between lungs -->
    <rect x="917" y="1218" width="16" height="36" fill="#d4d4d4" stroke="#2b2b2d" stroke-width="1.2"/>
    <!-- Connector arrow from lungs to main trachea -->
    <path d="M 740 1280  C 660 1280 600 1180 540 1095" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="545,1100 533,1097 537,1110" fill="#888888"/>
    <text x="690" y="1230" text-anchor="middle" class="label">prāṇa</text>
  </g>

  <!-- ======================================================== -->
  <!-- HIDDEN — Zones of articulation                           -->
  <!-- Five Pāṇinian sthāna regions as named groups.            -->
  <!-- opacity=0 keeps them invisible in the rendered base but  -->
  <!-- preserves them as positional anchors for claude design.  -->
  <!-- ======================================================== -->
  <g id="zones-hidden" opacity="0">

    <!-- 26. Kaṇṭhya (velar) zone — around soft palate / back of throat -->
    <g id="zone-kanthya-velar">
      <ellipse cx="365" cy="600" rx="80" ry="35"
               fill="#d4974a" stroke="#a8762d" stroke-width="1.2"/>
    </g>

    <!-- 27. Tālavya (palatal) zone — around hard palate -->
    <g id="zone-talavya-palatal">
      <ellipse cx="230" cy="585" rx="65" ry="28"
               fill="#d4974a" stroke="#a8762d" stroke-width="1.2"/>
    </g>

    <!-- 28. Mūrdhanya (retroflex) zone — around alveolar ridge -->
    <g id="zone-murdhanya-retroflex">
      <ellipse cx="145" cy="595" rx="32" ry="22"
               fill="#d4974a" stroke="#a8762d" stroke-width="1.2"/>
    </g>

    <!-- 29. Dantya (dental) zone — around upper teeth -->
    <g id="zone-dantya-dental">
      <ellipse cx="115" cy="620" rx="22" ry="22"
               fill="#d4974a" stroke="#a8762d" stroke-width="1.2"/>
    </g>

    <!-- 30. Oṣṭhya (labial) zone — around lips -->
    <g id="zone-osthya-labial">
      <ellipse cx="78" cy="625" rx="38" ry="48"
               fill="#d4974a" stroke="#a8762d" stroke-width="1.2"/>
    </g>

  </g>

  <!-- ======================================================== -->
  <!-- Version stamp (small, faint, bottom-right)               -->
  <!-- ======================================================== -->
  <text x="30" y="1390" text-anchor="start" class="label" font-size="14">
    v0.1 schematic
  </text>

</svg>
