<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="svg-yaska-converge" viewBox="0 0 324 264" width="4.5in" height="3.667in">
  <rect x="0.00" y="0.00" width="324.00" height="264.00" fill="#f4f4f3"/>
  <circle cx="162" cy="44" r="21" fill="#4a3f30"/>
  <text x="162.00" y="45.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="13" font-weight="700" font-style="normal" fill="#f3f2ef" text-anchor="middle">अग्नि</text>
  <text x="162.00" y="58.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="9" font-weight="400" font-style="italic" fill="#e0d7c6" text-anchor="middle">agni</text>
  <line x1="145.00" y1="56.00" x2="144.00" y2="76.00" stroke="#c3b9a3" stroke-width="0.9"/>
  <line x1="179.00" y1="56.00" x2="180.00" y2="76.00" stroke="#c3b9a3" stroke-width="0.9"/>
  <text x="12.00" y="88.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="10" font-weight="700" font-style="normal" fill="#2b2b2d" text-anchor="start">अग्र + ⟪नी⟫</text>
  <text x="64.00" y="88.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="9" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">agra + nī</text>
  <text x="12.00" y="103.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#766652" text-anchor="start">that which leads at the front</text>
  <text x="12.00" y="118.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">Fire leads the</text>
  <text x="67.00" y="118.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="9.5" font-weight="700" font-style="normal" fill="#2b2b2d" text-anchor="start">यज्ञ</text>
  <text x="84.00" y="118.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="italic" fill="#4a4136" text-anchor="start">yajña.</text>
  <text x="12.00" y="130.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">It is brought forward before</text>
  <text x="12.00" y="142.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">the offering begins.</text>
  <text x="172.00" y="88.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="10" font-weight="700" font-style="normal" fill="#2b2b2d" text-anchor="start">अङ्ग + ⟪नी⟫</text>
  <text x="226.00" y="88.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="9" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">aṅga + nī</text>
  <text x="172.00" y="103.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#766652" text-anchor="start">that which leads the limbs</text>
  <text x="172.00" y="118.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">Fire animates the body; warmth</text>
  <text x="172.00" y="130.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">activates the limbs.</text>
  <line x1="162.00" y1="65.00" x2="162.00" y2="160.12" stroke="#c3b9a3" stroke-width="0.9"/>
  <line x1="162.00" y1="160.12" x2="144.00" y2="160.12" stroke="#c3b9a3" stroke-width="0.9"/>
  <line x1="162.00" y1="160.12" x2="180.00" y2="160.12" stroke="#c3b9a3" stroke-width="0.9"/>
  <line x1="144.00" y1="160.12" x2="144.00" y2="163.12" stroke="#c3b9a3" stroke-width="0.9"/>
  <line x1="180.00" y1="160.12" x2="180.00" y2="163.12" stroke="#c3b9a3" stroke-width="0.9"/>
  <text x="12.00" y="173.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="10" font-weight="700" font-style="normal" fill="#2b2b2d" text-anchor="start">अक्नोपन</text>
  <text x="45.00" y="173.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="9" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">aknopana</text>
  <text x="12.00" y="188.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#766652" text-anchor="start">that which does not moisten</text>
  <text x="12.00" y="202.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="9.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">अ- + ⟪क्नोप्⟫</text>
  <text x="12.00" y="217.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">Fire dries; it does not moisten.</text>
  <text x="12.00" y="240.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="normal" fill="#9a7833" text-anchor="start">Yaska credits:</text>
  <text x="74.00" y="240.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="9.5" font-weight="700" font-style="normal" fill="#4a4136" text-anchor="start">स्थौलाष्ठीवि</text>
  <text x="12.00" y="254.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">Sthaulāṣṭhīvi</text>
  <text x="172.00" y="173.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="8.5" font-weight="700" font-style="normal" fill="#2b2b2d" text-anchor="start">⟪इ⟫ + ⟪अञ्ज्⟫ + ⟪दह्⟫ → अग्नि</text>
  <text x="172.00" y="187.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">i + añj + dah</text>
  <text x="237.00" y="187.00" font-family="'Arial Unicode MS', Arial, sans-serif" font-size="8.5" font-weight="400" font-style="normal" fill="#4a4136" text-anchor="start">→</text>
  <text x="250.00" y="187.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">agni</text>
  <text x="172.00" y="201.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#766652" text-anchor="start">three dhātavaḥ contribute</text>
  <text x="172.00" y="216.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">motion, illumination, and burning</text>
  <text x="172.00" y="228.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="400" font-style="normal" fill="#2b2b2d" text-anchor="start">to one word.</text>
  <text x="172.00" y="240.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="normal" fill="#9a7833" text-anchor="start">Yaska credits:</text>
  <text x="234.00" y="240.00" font-family="'Adobe Devanagari', 'Noto Serif Devanagari', serif" font-size="9.5" font-weight="700" font-style="normal" fill="#4a4136" text-anchor="start">शकपूणि</text>
  <text x="172.00" y="254.00" font-family="'Gentium Book Plus', Charter, 'Charis SIL', Georgia, serif" font-size="8.5" font-weight="700" font-style="italic" fill="#4a4136" text-anchor="start">Śakapūṇi</text>
</svg>
