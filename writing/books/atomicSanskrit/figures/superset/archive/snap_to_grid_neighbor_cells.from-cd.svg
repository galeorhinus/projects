  <text x="45" y="729" font-size="28" text-anchor="start" fill="#2b2b2d" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">Kurukh). Sanskrit places <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#2b2b2d">स</tspan> at the dental grid address.</text>
  
