  <line x1="45" y1="1064" x2="1075" y2="1064" stroke="#e0ddd5" stroke-width="1.5"></line>
  <text x="560" y="1108" font-size="28" text-anchor="middle" fill="#555759" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">Each row shows one of the three cells the Southern Survey leaves unfilled. The</text>
  <text x="560" y="1143" font-size="28" text-anchor="middle" fill="#555759" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">southern languages occupy nearby places in the same zone; Sanskrit snaps each</text>
  <text x="560" y="1178" font-size="28" text-anchor="middle" fill="#555759" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">zone to a specific grid address. <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#555759">श</tspan> is the palatal member of Sanskrit&#39;s complete</text>
  <text x="560" y="1213" font-size="28" text-anchor="middle" fill="#555759" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">three-sibilant system (<tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#555759">स</tspan> · <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#555759">ष</tspan> · <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#555759">श</tspan>).</text>
