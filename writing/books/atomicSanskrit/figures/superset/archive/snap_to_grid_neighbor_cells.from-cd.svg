  <text x="45" y="964" font-size="28" text-anchor="start" fill="#2b2b2d" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">Southern sibilants spread across alveolar and post-alveolar (Tamil ś / ṣ).</text>
  <text x="45" y="999" font-size="28" text-anchor="start" fill="#2b2b2d" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">Sanskrit&#39;s three-sibilant system spans the coronal range — <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#2b2b2d">स</tspan> dental, <tspan font-family="&#39;Adobe Devanagari&#39;, &#39;Noto Serif Devanagari&#39;, &#39;Kohinoor Devanagari&#39;, &#39;Devanagari MT&#39;, serif" fill="#2b2b2d">ष</tspan></text>
