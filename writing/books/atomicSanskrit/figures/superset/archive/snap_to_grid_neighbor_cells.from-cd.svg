  <text x="45" y="176" font-size="28" text-anchor="start" fill="#555759" font-style="italic" font-weight="400" font-family="&#39;Gentium Book Plus&#39;, Charter, &#39;Charis SIL&#39;, Georgia, serif">place-coding choices, not field absences.</text>
  
