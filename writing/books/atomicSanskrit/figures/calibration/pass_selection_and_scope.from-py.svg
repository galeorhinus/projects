<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9d7c36"/></marker>
</defs>
<rect width="1200" height="1160" fill="#f7f4ed"/>
<text x="52.0" y="66.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="44" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">What Earns a Place in the Architecture</text>
<text x="52.0" y="107.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="italic" fill="#6e675d" text-anchor="start">The Principle of Architectural Selection and Scope</text>
<rect x="52" y="150" width="245" height="160" rx="5" fill="#f0ece3" stroke="#cfc6b5" stroke-width="2"/>
<circle cx="83" cy="181" r="18" fill="#29251f"/>
<text x="83.0" y="191.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">1</text>
<text x="110.0" y="192.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Contribution</text>
<text x="74.0" y="251.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="74.0" dy="0">What does it add?</tspan>
</text>
<rect x="340" y="150" width="245" height="160" rx="5" fill="#f0ece3" stroke="#cfc6b5" stroke-width="2"/>
<circle cx="371" cy="181" r="18" fill="#29251f"/>
<text x="371.0" y="191.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">2</text>
<text x="398.0" y="192.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Load</text>
<text x="362.0" y="251.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="362.0" dy="0">What collision or</tspan>
<tspan x="362.0" dy="34">duplication follows?</tspan>
</text>
<rect x="628" y="150" width="245" height="160" rx="5" fill="#f0ece3" stroke="#cfc6b5" stroke-width="2"/>
<circle cx="659" cy="181" r="18" fill="#29251f"/>
<text x="659.0" y="191.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">3</text>
<text x="686.0" y="192.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Bounding</text>
<text x="686.0" y="226.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">support</text>
<text x="650.0" y="272.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="650.0" dy="0">What contains</tspan>
<tspan x="650.0" dy="34">that load?</tspan>
</text>
<rect x="916" y="150" width="245" height="160" rx="5" fill="#f0ece3" stroke="#cfc6b5" stroke-width="2"/>
<circle cx="947" cy="181" r="18" fill="#29251f"/>
<text x="947.0" y="191.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">4</text>
<text x="974.0" y="192.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Scope</text>
<text x="938.0" y="251.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="938.0" dy="0">Where can it</tspan>
<tspan x="938.0" dy="34">operate?</tspan>
</text>
<path d="M 303,230.0 L 332,230.0" stroke="#9d7c36" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
<path d="M 591,230.0 L 620,230.0" stroke="#9d7c36" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
<path d="M 879,230.0 L 908,230.0" stroke="#9d7c36" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
<text x="52.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#6e675d" text-anchor="start">Possible scopes</text>
<rect x="260" y="340" width="150" height="58" rx="29" fill="#65715b"/>
<text x="335.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Included</text>
<rect x="423" y="340" width="166" height="58" rx="29" fill="#9d7c36"/>
<text x="506.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Restricted</text>
<rect x="602" y="340" width="140" height="58" rx="29" fill="#9d7c36"/>
<text x="672.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Vaidika</text>
<rect x="755" y="340" width="260" height="58" rx="29" fill="#9d7c36"/>
<text x="885.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Lineage-Bounded</text>
<rect x="1028" y="340" width="150" height="58" rx="29" fill="#8b4b3d"/>
<text x="1103.0" y="379.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Excluded</text>
<line x1="52" y1="440" x2="1148" y2="440" stroke="#cfc6b5" stroke-width="2"/>
<text x="52.0" y="487.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="34" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Physical possibility does not by itself create a sonomer.</text>
<text x="52.0" y="532.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Sanskrit can leave a grid address unassigned while preserving a nearby sound</text>
<text x="52.0" y="568.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">under a stated condition.</text>
<text x="72.0" y="625.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">Independent grid address</text>
<text x="620.0" y="625.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">Restricted articulation</text>
<rect x="72" y="646" width="508" height="150" rx="5" fill="#f7f4ed" stroke="#8b4b3d" stroke-width="2"/>
<text x="94.0" y="688.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="34" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">[ɰ] · kaṇṭhya–antaḥstha</text>
<text x="94.0" y="729.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="94.0" dy="0">No fifth vowel-to-glide operation;</tspan>
<tspan x="94.0" dy="34">independent scope adds load.</tspan>
</text>
<rect x="620" y="646" width="508" height="150" rx="5" fill="#f7f4ed" stroke="#65715b" stroke-width="2"/>
<text x="642.0" y="688.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="34" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">जिह्वामूलीय · jihvāmūlīya</text>
<text x="642.0" y="729.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="642.0" dy="0">Generated from visarga before</tspan>
<tspan x="642.0" dy="34">क / ख · Restricted scope.</tspan>
</text>
<rect x="72" y="826" width="508" height="150" rx="5" fill="#f7f4ed" stroke="#8b4b3d" stroke-width="2"/>
<text x="94.0" y="868.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="34" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">[ɸ] · oṣṭhya–ūṣman</text>
<text x="94.0" y="909.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="94.0" dy="0">No independent recurring contrast;</tspan>
<tspan x="94.0" dy="34">crowds the field beside फ.</tspan>
</text>
<rect x="620" y="826" width="508" height="150" rx="5" fill="#f7f4ed" stroke="#65715b" stroke-width="2"/>
<text x="642.0" y="868.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="34" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">उपध्मानीय · upadhmānīya</text>
<text x="642.0" y="909.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="642.0" dy="0">Generated from visarga before</tspan>
<tspan x="642.0" dy="34">प / फ · Restricted scope.</tspan>
</text>
<rect x="52" y="1010" width="1096" height="116" fill="#29251f"/>
<text x="600.0" y="1051.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#e8dfcc" text-anchor="middle">The same principle operates across scale:</text>
<text x="600.0" y="1097.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="32" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">sound-field → sonomer grid → Vaidika and Laukika scope</text>
</svg>