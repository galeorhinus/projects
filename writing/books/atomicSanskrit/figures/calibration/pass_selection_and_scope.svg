<text x="1040.0" y="319.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="18" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">Excluded</text>
<line x1="52" y1="365" x2="1148" y2="365" stroke="#cfc6b5" stroke-width="2"/>
<text x="52.0" y="407.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#29251f" text-anchor="start">Physical possibility does not by itself create a sonomer.</text>
<text x="52.0" y="439.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="20" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">Sanskrit can leave a grid address unassigned while preserving a nearby sound under a stated condition.</text>
<text x="72.0" y="486.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="20" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">Independent grid address</text>
<text x="620.0" y="486.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="20" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">Restricted articulation</text>
<rect x="72" y="505" width="508" height="112" rx="5" fill="#f7f4ed" stroke="#8b4b3d" stroke-width="2"/>
<text x="94.0" y="543.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">[ɰ] · kaṇṭhya–antaḥstha</text>
<text x="94.0" y="576.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="18" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="94.0" dy="0">No fifth vowel-to-glide operation; independent scope adds load.</tspan>
</text>
<rect x="620" y="505" width="508" height="112" rx="5" fill="#f7f4ed" stroke="#65715b" stroke-width="2"/>
<text x="642.0" y="543.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">जिह्वामूलीय · jihvāmūlīya</text>
<text x="642.0" y="576.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="18" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="642.0" dy="0">Generated from visarga before क / ख; Restricted scope.</tspan>
</text>
<rect x="72" y="637" width="508" height="112" rx="5" fill="#f7f4ed" stroke="#8b4b3d" stroke-width="2"/>
<text x="94.0" y="675.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#8b4b3d" text-anchor="start">[ɸ] · oṣṭhya–ūṣman</text>
<text x="94.0" y="708.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="18" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="94.0" dy="0">No independent recurring contrast; crowds the field beside फ.</tspan>
</text>
<rect x="620" y="637" width="508" height="112" rx="5" fill="#f7f4ed" stroke="#65715b" stroke-width="2"/>
<text x="642.0" y="675.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="27" font-weight="600" font-style="normal" fill="#65715b" text-anchor="start">उपध्मानीय · upadhmānīya</text>
<text x="642.0" y="708.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="18" font-weight="400" font-style="normal" fill="#6e675d" text-anchor="start">
<tspan x="642.0" dy="0">Generated from visarga before प / फ; Restricted scope.</tspan>
</text>
<rect x="52" y="785" width="1096" height="76" fill="#29251f"/>
<text x="600.0" y="820.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="21" font-weight="600" font-style="normal" fill="#e8dfcc" text-anchor="middle">The same principle operates across scale:</text>
<text x="600.0" y="848.0" font-family="EB Garamond, Charter, Georgia, serif" font-size="24" font-weight="600" font-style="normal" fill="#f7f4ed" text-anchor="middle">sound-field → sonomer grid → Vaidika and Laukika scope</text>
