<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 18.1: The Architectural Test. Editable canonical SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 536" width="4.75in" height="5.583in" role="img" aria-labelledby="title desc">
  <title id="title">The Architectural Test</title>
  <desc id="desc">Six features that a valid model of Sanskrit must explain, compared with what genealogical reconstruction provides.</desc>

  <rect width="456" height="536" fill="#f4f4f3"/>

  <text x="18" y="31" font-family="'Gentium Book Plus', Georgia, serif" font-size="22" font-weight="600" fill="#2b2b2d">The Architectural Test</text>
  <text x="18" y="51" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.5" font-style="italic" fill="#766652">Six features any model of Sanskrit must explain</text>

  <rect x="18" y="68" width="222" height="36" fill="#4a4136"/>
  <rect x="240" y="68" width="198" height="36" fill="#6b6a67"/>
  <text x="30" y="90" font-family="'Gentium Book Plus', Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">SANSKRIT'S ARCHITECTURE</text>
  <text x="252" y="90" font-family="'Gentium Book Plus', Georgia, serif" font-size="12" font-weight="700" fill="#ffffff">GENEALOGY PROVIDES</text>

  <!-- Row 1 -->
  <rect x="18" y="104" width="222" height="68" fill="#faf7f0" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="104" width="198" height="68" fill="#eceae6" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="123" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">SONOMER GRID</text>
  <text x="30" y="141" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Reusable sounds selected and ordered</tspan>
    <tspan x="30" dy="14">by place of articulation and effort</tspan>
  </text>
  <text x="252" y="123" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">Sound inventory and recurring</tspan>
    <tspan x="252" dy="14">correspondences; no sonomer</tspan>
    <tspan x="252" dy="14">address grid</tspan>
  </text>

  <!-- Row 2 -->
  <rect x="18" y="172" width="222" height="68" fill="#f7f2e7" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="172" width="198" height="68" fill="#e5e3df" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="191" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">DHĀTU ARCHITECTURE</text>
  <text x="30" y="209" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Semantic atoms built from sonomers</tspan>
    <tspan x="30" dy="14">retain identity and generate word families</tspan>
  </text>
  <text x="252" y="191" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">Reconstructed lexical bases;</tspan>
    <tspan x="252" dy="14">no atomic constituent system</tspan>
  </text>

  <!-- Row 3 -->
  <rect x="18" y="240" width="222" height="68" fill="#faf7f0" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="240" width="198" height="68" fill="#eceae6" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="259" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">GENERATIVE RULES</text>
  <text x="30" y="277" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Saṃdhi, gaṇa, upasarga, pratyaya,</tspan>
    <tspan x="30" dy="14">carry sonomers into words and sentences</tspan>
  </text>
  <text x="252" y="259" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">Patterns of sound change;</tspan>
    <tspan x="252" dy="14">no Sanskrit language engine</tspan>
  </text>

  <!-- Row 4 -->
  <rect x="18" y="308" width="222" height="68" fill="#f7f2e7" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="308" width="198" height="68" fill="#e5e3df" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="327" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">MŪRDHANYA CORE</text>
  <text x="30" y="345" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Retroflexion embedded across</tspan>
    <tspan x="30" dy="14">the sonomer and atom architecture</tspan>
  </text>
  <text x="252" y="327" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">No inherited retroflex series;</tspan>
    <tspan x="252" dy="14">reclassified as later borrowing</tspan>
  </text>

  <!-- Row 5 -->
  <rect x="18" y="376" width="222" height="68" fill="#faf7f0" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="376" width="198" height="68" fill="#eceae6" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="395" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">PRESERVATION</text>
  <text x="30" y="413" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Recitation paths, sound disciplines,</tspan>
    <tspan x="30" dy="14">meter, and distributed lineages</tspan>
  </text>
  <text x="252" y="395" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">No anti-entropy architecture</tspan>
    <tspan x="252" dy="14">or exact transmission system</tspan>
  </text>

  <!-- Row 6 -->
  <rect x="18" y="444" width="222" height="68" fill="#f7f2e7" stroke="#c3b9a3" stroke-width="0.7"/>
  <rect x="240" y="444" width="198" height="68" fill="#e5e3df" stroke="#c9c8c4" stroke-width="0.7"/>
  <text x="30" y="463" font-family="'Gentium Book Plus', Georgia, serif" font-size="13" font-weight="700" fill="#4a4136">FORMAL GRAMMAR</text>
  <text x="30" y="481" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="30" dy="0">Siddha / kārya and disciplines that</tspan>
    <tspan x="30" dy="14">specify and decode Sanskrit</tspan>
  </text>
  <text x="252" y="463" font-family="'Gentium Book Plus', Georgia, serif" font-size="11.2" fill="#2b2b2d">
    <tspan x="252" dy="0">Later cultural artifacts placed</tspan>
    <tspan x="252" dy="14">outside the language model</tspan>
  </text>

  <line x1="18" y1="520" x2="438" y2="520" stroke="#4a4136" stroke-width="1.2"/>
</svg>
