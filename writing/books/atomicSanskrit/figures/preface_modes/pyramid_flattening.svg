<text x="390.0" y="40" font-size="21" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">The Pyramid Turns Domain and Mode Into Chronology</text>
<text x="390.0" y="66" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">Pāṇini becomes the rupture point: pre-Pāṇini = Vedic, post-Pāṇini = Classical.</text>
<rect x="90" y="98" width="610" height="96" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.6" rx="8" ry="8"/>
<text x="390.0" y="126" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">Sanskrit architecture</text>
<text x="390.0" y="152" font-size="13" fill="#111111" font-weight="normal" text-anchor="middle" font-style="normal">one engineered system across both sides of Pāṇini</text>
<text x="390.0" y="176" font-size="12" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">domains: vaidika / laukika · modes: chandas / bhāṣā</text>
