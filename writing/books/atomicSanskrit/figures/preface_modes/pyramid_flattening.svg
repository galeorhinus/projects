<text x="242.5" y="277" font-size="20" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">“Vedic”</text>
<text x="547.5" y="255" font-size="11" fill="#822529" font-weight="bold" text-anchor="middle" font-style="normal">pyramid's invention</text>
<text x="547.5" y="277" font-size="20" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">“Classical”</text>
<text x="72" y="266" font-size="12" fill="#822529" font-weight="bold" text-anchor="end" font-style="normal">split</text>
