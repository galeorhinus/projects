<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="Charter, Bitstream Charter, DejaVu Serif, Noto Sans Devanagari, serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111111"/></marker></defs>
<text x="390.0" y="40" font-size="21" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">The Orthodoxy Turns Domain and Mode Into Chronology</text>
<text x="390.0" y="66" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">Pāṇini becomes the rupture point: pre-Pāṇini = Vedic, post-Pāṇini = Classical.</text>
<rect x="90" y="98" width="610" height="96" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.6" rx="8" ry="8"/>
<text x="390.0" y="126" font-size="20" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">Sanskrit architecture</text>
<text x="390.0" y="152" font-size="13" fill="#111111" font-weight="normal" text-anchor="middle" font-style="normal">one engineered system across both sides of Pāṇini</text>
<text x="390.0" y="176" font-size="12" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">domains: vaidika / laukika · modes: chandas / bhāṣā</text>
<rect x="90" y="230" width="305" height="58" fill="#FFF8F8" stroke="#822529" stroke-width="1.2" rx="6" ry="6"/>
<rect x="395" y="230" width="305" height="58" fill="#FFF8F8" stroke="#822529" stroke-width="1.2" rx="6" ry="6"/>
<text x="242.5" y="255" font-size="11" fill="#822529" font-weight="bold" text-anchor="middle" font-style="normal">orthodoxy's invention</text>
<text x="242.5" y="277" font-size="20" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">“Vedic”</text>
<text x="547.5" y="255" font-size="11" fill="#822529" font-weight="bold" text-anchor="middle" font-style="normal">orthodoxy's invention</text>
<text x="547.5" y="277" font-size="20" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">“Classical”</text>
<text x="72" y="266" font-size="12" fill="#822529" font-weight="bold" text-anchor="end" font-style="normal">split</text>
<line x1="395" y1="344" x2="395" y2="214" stroke="#111111" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="341" y="184" width="108" height="30" fill="white" stroke="#111111" stroke-width="1.0" rx="5" ry="5"/>
<text x="395" y="205" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">Pāṇini</text>
<line x1="90" y1="326" x2="700" y2="326" stroke="#111111" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90" y="354" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="start" font-style="normal">pre-Pāṇini</text>
<text x="700" y="354" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="end" font-style="normal">post-Pāṇini</text>
<text x="390.0" y="372" font-size="12" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="italic">time</text>
<rect x="88" y="368" width="604" height="34" fill="white" stroke="#8A6A00" stroke-width="1.4" rx="7" ry="7"/>
<text x="390.0" y="390" font-size="15" fill="#8A6A00" font-weight="bold" text-anchor="middle" font-style="normal">The orthodoxy makes Pāṇini a rupture. The architecture makes him a witness.</text>
</svg>
