<text x="235.0" y="139" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="middle" font-style="normal">vaidika</text>
<text x="235.0" y="167" font-size="20" fill="#111111" font-weight="normal" text-anchor="middle" font-style="normal">वैदिक</text>
<text x="235.0" y="199" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">Vedic domain</text>
<text x="235.0" y="224" font-size="11" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">the śruti / Veda domain</text>
