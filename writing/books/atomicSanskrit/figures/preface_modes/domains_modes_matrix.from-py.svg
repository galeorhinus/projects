<text x="513.0" y="367" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">laukika speech-literary mode</text>
<text x="513.0" y="392" font-size="11" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">generative learned usage</text>
<line x1="98" y1="259.0" x2="628" y2="259.0" stroke="#C9CDD2" stroke-width="1.1"/>
<line x1="374.0" y1="95" x2="374.0" y2="423" stroke="#C9CDD2" stroke-width="1.1"/>
<text x="360.0" y="432" font-size="18" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">Domain is not chronology. Mode is not drift.</text>
