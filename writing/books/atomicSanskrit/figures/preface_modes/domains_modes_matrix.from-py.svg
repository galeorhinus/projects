<text x="235.0" y="392" font-size="11" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">meter-bound operation</text>
<rect x="388" y="273" width="250" height="140" fill="#F7F8FA" stroke="#2D6A4F" stroke-width="1.4" rx="7" ry="7"/>
<text x="513.0" y="307" font-size="22" fill="#2D6A4F" font-weight="bold" text-anchor="middle" font-style="normal">bhāṣā</text>
