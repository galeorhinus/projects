<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="Charter, Bitstream Charter, DejaVu Serif, Noto Sans Devanagari, serif">
<rect width="100%" height="100%" fill="white"/>
<text x="360.0" y="42" font-size="24" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">Indic Two-Axis Vocabulary</text>
<text x="360.0" y="68" font-size="13" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">Domains name where Sanskrit operates. Modes name how the architecture runs.</text>
