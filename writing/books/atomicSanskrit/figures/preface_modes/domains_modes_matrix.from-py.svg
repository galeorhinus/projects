<text x="513.0" y="199" font-size="13" fill="#111111" font-weight="bold" text-anchor="middle" font-style="normal">worldly learned domain</text>
<text x="513.0" y="224" font-size="11" fill="#5f6368" font-weight="normal" text-anchor="middle" font-style="normal">śāstra, kāvya, discourse</text>
<rect x="110" y="273" width="250" height="140" fill="#F7F8FA" stroke="#2D6A4F" stroke-width="1.4" rx="7" ry="7"/>
