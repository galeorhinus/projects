<rect width="1200" height="378" fill="#f7f4ed"/>
<text x="1166" y="34" text-anchor="end" font-family="STIX Two Text, Georgia, serif" font-size="27" fill="#9a7833">07</text>
<rect x="34" y="51" width="218" height="40" rx="2" fill="#ede5d1"/>
<text x="48" y="80" font-family="STIX Two Text, Georgia, serif" font-size="28" font-weight="700" fill="#29251f">Judaism</text>
<text x="292" y="79" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>The</tspan><tspan> Day</tspan><tspan> of</tspan><tspan> the</tspan><tspan> Lord,</tspan><tspan> judgment,</tspan><tspan> and</tspan><tspan> defeat</tspan><tspan> of</tspan><tspan> those</tspan><tspan> obstructing</tspan></text>
<text x="292" y="115" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>restoration.</tspan></text>
<rect x="34" y="138" width="218" height="40" rx="2" fill="#d9caa8"/>
<text x="48" y="167" font-family="STIX Two Text, Georgia, serif" font-size="28" font-weight="700" fill="#29251f">Christianity</text>
<text x="292" y="166" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>Revelation,</tspan><tspan> final</tspan><tspan> judgment,</tspan><tspan> and</tspan><tspan> destruction</tspan><tspan> before</tspan><tspan> the</tspan><tspan> perfected</tspan></text>
<text x="292" y="202" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>replacement.</tspan></text>
<rect x="34" y="225" width="218" height="40" rx="2" fill="#ad9b76"/>
<text x="48" y="254" font-family="STIX Two Text, Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Islam</text>
<text x="292" y="253" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan font-style="italic">Yawm</tspan><tspan font-style="italic"> al-Qiyāmah,</tspan><tspan> judgment,</tspan><tspan> and</tspan><tspan> punishment</tspan><tspan> in</tspan><tspan font-style="italic"> Jahannam.</tspan></text>
<rect x="34" y="280" width="218" height="40" rx="2" fill="#4a4033"/>
<text x="48" y="309" font-family="STIX Two Text, Georgia, serif" font-size="28" font-weight="700" fill="#ffffff">Progressivism</text>
<text x="292" y="308" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>Climate</tspan><tspan> catastrophe</tspan><tspan> becomes</tspan><tspan> judgment</tspan><tspan> day.</tspan><tspan> One</tspan><tspan> prescribed</tspan><tspan> “solution”</tspan></text>
<text x="292" y="344" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>promises</tspan><tspan> salvation;</tspan><tspan> anyone</tspan><tspan> who</tspan><tspan> questions</tspan><tspan> it</tspan><tspan> becomes</tspan><tspan> a</tspan><tspan> denier.</tspan></text>
