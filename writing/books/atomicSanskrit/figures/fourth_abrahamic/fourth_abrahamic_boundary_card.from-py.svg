<text x="292" y="134" font-family="STIX Two Text, Georgia, serif" font-size="29" fill="#4a4136"><tspan>Believer</tspan><tspan> and</tspan><tspan> heathen;</tspan><tspan> orthodox</tspan><tspan> and</tspan><tspan> heretic;</tspan><tspan> saved</tspan><tspan> and</tspan><tspan> damned.</tspan></text>
