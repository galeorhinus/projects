# Atomic Sanskrit — Source and Reference Companion metadata.
#
# Parallels as_book.yaml. The companion is a separate publication artifact:
# the full long-form endnotes (citations, verification trails, source-history
# discussions) for serious readers, reviewers, critics, and hostile academics.
# Title-page identity differs from the main book; typography matches for
# visual consistency across the two volumes.
#
# Edit values here — never duplicate inline in scripts or templates.

# --- Companion identity ---
title: Atomic Sanskrit
subtitle: "*Source and Reference Companion*"
series: "Companion to *Atomic Sanskrit*"
author: Parag Tope
lang: en-US

# --- Typography (matches as_book.yaml) ---
mainfont: STIX Two Text            # Latin + IAST diacritics
mainfontoptionsraw: "BoldFont={STIX Two Text},BoldFeatures={RawFeature={+axis={wght=700}}}"  # Passed by build_book.py so Pandoc does not escape the fontspec braces.
devanagarifont: Tiro Devanagari Sanskrit   # OFL; covers Vedic Extensions, which Adobe Devanagari does not
devanagarifontoptions: AutoFakeBold=1.8    # Tiro ships no bold weight; the book sets 106 Devanagari headings
fontsize: 10.5pt
# Line spacing is layout-specific; edit PUBLICATIONS["companion"] in
# build_book.py.

# --- Document structure ---
documentclass: book
top-level-division: chapter
toc: true
toc-depth: 1                       # Preface + Endnotes in ToC; entries discoverable via PDF search
colorlinks: true
linkcolor: NavyBlue
urlcolor: NavyBlue

# --- Title-page customization ---
# Inject a "Companion to Atomic Sanskrit" line ABOVE the title block on the
# title page. Parallels the as_book.yaml header-includes pattern; the
# specific text is the only divergence from the main book.
header-includes:
  - |
    ```{=latex}
    \makeatletter
    \AtBeginDocument{%
      \pretocmd{\@title}%
        {{\normalsize\scshape Companion to \emph{Atomic Sanskrit}\par}\vspace{1.5em}}%
        {}{}%
    }
    \makeatother
    ```
