# /etc/fail2ban/filter.d/caddy-basicauth.conf
#
# Matches HTTP 401 responses from Caddy on /as/* (the Atomic Sanskrit book
# under HTTP basic auth at secondshanti.org/as/). Designed for Caddy's
# default JSON access-log format.
#
# Sample line:
#   {"level":"error",..."remote_ip":"203.0.113.7",..."uri":"/as/",..."status":401,...}
#
# Each match counts one failed credential attempt; the jail decides when
# to ban based on maxretry / findtime / bantime.

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/as[^"]*".*"status":401
ignoreregex =

# Caddy emits its timestamp as a Unix epoch in the "ts" JSON field
# (e.g. "ts":1779665478.6826475). {EPOCH} tells fail2ban to parse it.
datepattern = "ts":{EPOCH}
