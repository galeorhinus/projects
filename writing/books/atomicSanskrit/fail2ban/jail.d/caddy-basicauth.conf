# /etc/fail2ban/jail.d/caddy-basicauth.conf
#
# Bans an IP for 1 hour after 20 failed basic-auth attempts on /as/* within
# a 10-minute window. Watches Caddy's JSON access log.
#
# NOTE on maxretry: HTTP basic auth always emits a 401 *challenge* on the
# first request to a protected path before the browser resends with
# credentials, and Caddy redacts the Authorization header in its log, so a
# challenge-401 and a wrong-password-401 look identical to the filter. A
# legitimate reader on two devices, across both gated tiers (/as/book/ and
# /as/private/), with a couple of password mistypes, generates ~10-15 of
# these in a session. maxretry was originally 5, which banned real readers
# (see the 2026-05-29 false-positive on 99.40.98.220). 20 sits above normal
# browsing but well below a genuine brute-force (hundreds-to-thousands of
# attempts), which still trips the jail inside the 10-minute window.

[caddy-basicauth]
enabled  = true
port     = http,https
filter   = caddy-basicauth
logpath  = /var/log/caddy/access.log
maxretry = 20
findtime = 600
bantime  = 3600
# Whitelist localhost + this server's own public IPs so test curls from the
# box don't accidentally lock themselves out. Add other trusted IPs here.
ignoreip = 127.0.0.1/8 ::1 158.69.77.80 2607:5300:201:2000::b48
