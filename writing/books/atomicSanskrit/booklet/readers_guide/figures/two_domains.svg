<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" width="720" height="245" role="img" aria-label="One Sanskrit architecture: exact Vedic transmission and new expression">
  <title>One Sanskrit architecture: exact Vedic transmission and new expression</title>
  <rect x="0" y="0" width="720" height="245" fill="white" stroke="none" />
  <text x="360" y="29" fill="#24665e" font-size="24" text-anchor="middle" font-family="STIX Two Text" font-weight="bold">ONE SANSKRIT ARCHITECTURE</text>
  <line x1="12" y1="48" x2="708" y2="48" stroke="#a8842c" stroke-width="3" />
  <text x="174" y="91" fill="#3d2f1f" font-size="34" text-anchor="middle" font-family="Tiro Devanagari Sanskrit" font-weight="normal">वैदिक</text>
  <text x="174" y="120" fill="#24665e" font-size="22" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">vaidika</text>
  <text x="174" y="154" fill="#3d2f1f" font-size="24" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">Keep the examples exact</text>
  <text x="174" y="189" fill="#24665e" font-size="22" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">Recite · compare · correct</text>
  <text x="546" y="91" fill="#3d2f1f" font-size="34" text-anchor="middle" font-family="Tiro Devanagari Sanskrit" font-weight="normal">लौकिक</text>
  <text x="546" y="120" fill="#24665e" font-size="22" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">laukika</text>
  <text x="546" y="154" fill="#3d2f1f" font-size="24" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">Make new expressions</text>
  <text x="546" y="189" fill="#24665e" font-size="22" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">Explain · compose · name</text>
  <line x1="323" y1="99" x2="395" y2="99" stroke="#a8842c" stroke-width="3" />
  <polygon points="395,99 385.2430558494279,104.07957093095631 385.2430558494279,93.92042906904369" fill="#a8842c" />
  <text x="360" y="236" fill="#24665e" font-size="22" text-anchor="middle" font-family="STIX Two Text" font-weight="normal">A fixed reference supports continued creation</text>
</svg>