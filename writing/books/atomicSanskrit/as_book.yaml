# Atomic Sanskrit — canonical book metadata.
#
# Single source of truth for book identity + typography + document-structure
# settings the PDF build uses. Read by pandoc directly via build_book.py's
# --metadata-file flag, and (for the Devanagari font name) by build_book.py
# to template-substitute the LaTeX preamble. Edit values here — never
# duplicate inline in scripts or templates.

# --- Book identity ---
title: Atomic Sanskrit
subtitle: "The Radiant, Calibrant, and Fractal Architecture of Sanātan"
series: "Volume 1 of *Second Shanti*"   # Rendered onto the title page via header-includes below.
author: Parag Tope
lang: en-US

# --- Typography ---
mainfont: EB Garamond              # Latin + IAST diacritics
devanagarifont: Adobe Devanagari   # custom variable; substituted into templates/devanagari-preamble.tex.in
# fontsize moved to build_book.py's LAYOUT_FONTSIZES (2026-08-27) — like PDF
# geometry, base font size is layout-specific (a phone-trim page wants
# smaller type than a letter page), so it lives beside LAYOUTS rather than
# as one fixed value here. Edit per-layout sizes in build_book.py.
linestretch: 1.15

# --- Document structure ---
documentclass: book
top-level-division: chapter
toc: true
toc-depth: 2
colorlinks: true
linkcolor: NavyBlue
urlcolor: NavyBlue

# --- Title-page customization ---
# Inject a series line ABOVE the title block on the title page. We redefine
# the book class's \maketitle directly (no extra packages needed — titling
# would be cleaner but isn't in the basictex/macOS-default distribution).
# The series text is hardcoded here for now — if the series scheme grows
# (Vol 2, Vol 3, ...), revise both the `series:` field above and the
# \maketitle definition below in lockstep.
header-includes:
  - |
    ```{=latex}
    \makeatletter
    \AtBeginDocument{%
      \pretocmd{\@title}%
        {{\normalsize\scshape Second Shanti $\cdot$ Volume 1\par}\vspace{1.5em}}%
        {}{}%
    }
    \makeatother
    ```

# --- Document assembly ---
# The book's reading order. Used by build_book.py to assemble the manuscript.
#
# Each entry has:
#   kind      one of {dedication, front, part, chapter, end}
#   file      manuscript filename (null for "part" entries that emit a
#             \part{} break only; part entries may also carry opener prose)
#   title     canonical title rendered into the assembled markdown
#   subtitle  optional one-line italic subtitle below \part{} for "part"
#             entries — the eclipse-arc map (see
#             working/40_reference/decisions/eclipse_spine_conversion_plan.md). Null when
#             absent.
#
# Pandoc ignores keys it doesn't recognize; this `assembly` block coexists
# with pandoc's metadata-file consumption above. build_book.py parses it
# via parse_assembly_yaml() — a minimal no-dependency block-style parser
# specialized for this structure.
#
# Edit reading order here, not in build_book.py.
